name: backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", "eval_safety/**", "ml/**", "docs/API_CONTRACT.md", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "eval_safety/**", "ml/**", "docs/API_CONTRACT.md"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Copies Member A's model files from ml/ and verifies every checksum, so the real-model tests run too.
      - run: python scripts/fetch_model.py
      - run: python scripts/sync_vendored.py --check
      - run: python -m pytest tests -q
